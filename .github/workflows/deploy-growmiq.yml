# Deploy ChatterMate to chat.growmiq.io
#
# Setup (once), in the GitHub repo → Settings → Secrets and variables → Actions:
#   VPS_SSH_KEY   dedicated key constrained to scripts/ci_receiver.py
#   VPS_HOST      187.77.156.57
#   VPS_USER      root
#   VPS_KNOWN_HOSTS pinned SSH host public key
# Enable PRODUCTION_DEPLOY_ENABLED only after the read-only connection check.
#
# Images are built ON the VPS rather than here and pushed to a registry. That is
# the pragmatic choice for one 2-vCPU box: the backend image is 4.5 GB, so
# pushing and pulling it each deploy would cost far more than rebuilding the few
# layers that actually changed. Move to a registry when a second host appears.

name: Deploy to growmiq VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy app images after checks (false only verifies the connection)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never let two deploys touch the box at once — the second would rebuild
  # images out from under the first's restart.
  group: deploy-growmiq
  cancel-in-progress: false

jobs:
  verify:
    name: Multi-tenant checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against the single-org lock returning
        # The upstream signup endpoint 403s once one organization exists. If a
        # merge from upstream restores that block, the product silently reverts
        # to single-tenant — fail here rather than discover it in production.
        run: |
          if grep -q 'detail="Organization already exists"' backend/app/api/organizations.py; then
            echo "::error file=backend/app/api/organizations.py::single-org lock is back — signup would reject every tenant after the first"
            exit 1
          fi
          echo "OK: single-org lock absent"

      - name: Guard the account-recovery wiring
        # The forgot-password UI originally called /enterprise/signup/*, which
        # only exists in a private submodule that is not part of this
        # deployment — so the flow 404'd and the whole modal was hidden behind
        # an enterprise flag. If a merge restores either the enterprise path or
        # that flag, password recovery silently disappears again, and the only
        # symptom is a link nobody can find.
        run: |
          fail=0
          if grep -q "enterprise/signup/forgot-password" frontend/src/composables/useForgotPassword.ts; then
            echo "::error file=frontend/src/composables/useForgotPassword.ts::forgot-password points at the enterprise module again; it must call /auth/forgot-password/*"
            fail=1
          fi
          if grep -q 'hasEnterpriseModule && showForgotPasswordModal' frontend/src/views/LoginView.vue; then
            echo "::error file=frontend/src/views/LoginView.vue::forgot-password modal is gated on the enterprise module again"
            fail=1
          fi
          for route in verify-email resend-verification forgot-password/request forgot-password/verify; do
            grep -q "\"/$route\"" backend/app/api/account_auth.py || {
              echo "::error file=backend/app/api/account_auth.py::missing route /$route"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "OK: account recovery wired to the open-source API"
          exit $fail

      - name: Guard the platform-admin boundary
        # The operator console is the one place that crosses the tenant
        # boundary on purpose, so its guard has to stay exactly as narrow as it
        # is. Two ways it could silently widen:
        #   1. Being rebuilt on the "super_admin" permission, which is
        #      org-scoped and self-grantable — every tenant admin would become
        #      a platform operator.
        #   2. is_platform_admin becoming writable through any API, which would
        #      turn privilege escalation into a single request.
        run: |
          fail=0
          # The console spans several modules now. All of them gate through
          # app/core/platform_auth.py, so all of them are checked — a new one
          # added without being listed here would be the obvious place to put
          # a weaker guard.
          CONSOLE='backend/app/api/platform_admin.py backend/app/api/platform_insights.py backend/app/api/platform_manage.py backend/app/core/platform_auth.py'
          # Match super_admin used as a permission check, not merely named.
          # A bare grep for the word fails on the module docstring, which
          # exists precisely to explain why the permission must not be used
          # here — the guard would then flag its own rationale.
          if grep -nE '(require_permissions|require_any_permission|has_permission|check_permissions)\(.*super_admin|["'"'"']super_admin["'"'"'][[:space:]]+in[[:space:]]' $CONSOLE; then
            echo "::error::platform console must not key off the org-scoped, self-grantable super_admin permission"
            fail=1
          fi
          # Reading the flag in app/api/ is legitimate and common — the login
          # response carries it so the SPA can decide whether to draw the
          # console link. Writing it is the escalation. A line-oriented search
          # cannot tell the two apart and fired on correct code, so both the
          # request-model check and the assignment check are AST-based.
          python3 scripts/check_platform_admin_boundary.py || fail=1
          [ "$fail" = 0 ] && echo "OK: platform-admin boundary intact"
          exit $fail

      - name: Guard the feature catalog
        # The console renders FEATURE_CATALOG as a matrix of switches an
        # operator uses to take capabilities away from paying customers. A
        # switch with no gate behind it says a change was made when none was;
        # a gate keyed to a string outside the catalog can never be turned on.
        # Both are silent failures, so they are checked rather than trusted.
        run: python3 scripts/check_feature_catalog.py

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Deployment boundary checks
        run: python3 scripts/test_ci_receiver.py

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      # Checked out WITHOUT submodules on purpose: app/enterprise is private and
      # absent from this deployment, so the suite must pass the way production
      # actually runs — community mode.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest tests/ -q --no-cov

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Type check
        run: npm run type-check

  connection:
    name: Verify existing VPS stack (read only)
    if: github.repository == 'deemalvidarshana/chattmate'
    runs-on: ubuntu-latest
    steps:
      - name: Configure pinned SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Verify protected database, config and mounts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes -o ConnectTimeout=30
          "$VPS_USER@$VPS_HOST" check

  deploy:
    name: Deploy ChatterMate app containers only
    if: >-
      github.repository == 'deemalvidarshana/chattmate' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.deploy)
    needs: [verify, backend-test, frontend-test, connection]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Submit tested commit to the constrained deployment receiver
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          git archive --format=tar "$GITHUB_SHA" | gzip | \
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
              "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA"
      - name: Check public endpoint (read only)
        run: curl --fail --silent --show-error --retry 3 https://chat.growmiq.io/ -o /dev/null
